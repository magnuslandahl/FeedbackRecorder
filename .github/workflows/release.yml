name: Release

# Builds the real, installable app for every supported platform, with
# whisper.cpp and the speech model bundled inside, so a download is all anyone
# needs. Every app change pushed to main gets a new semantic version and
# refreshes the rolling "latest" release.

on:
  push:
    branches: [main]
    paths:
      - app/**
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to advance for this manual build
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Choose the release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.next.outputs.current }}
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
      reason: ${{ steps.next.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate the next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases can only be built from main, not ${GITHUB_REF}."
            exit 1
          fi

          baseline="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
          if [ -z "$baseline" ]; then
            baseline="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .name 2>/dev/null || true)"
          fi
          if [ -z "$baseline" ]; then
            baseline="$(node -p "require('./app/package.json').version")"
          fi

          labels='[]'
          title=''
          pull_number=''
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            pulls="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
            labels="$(printf '%s' "$pulls" | jq -c '.[0].labels // [] | map(.name)')"
            title="$(printf '%s' "$pulls" | jq -r '.[0].title // ""')"
            pull_number="$(printf '%s' "$pulls" | jq -r '.[0].number // ""')"
          fi

          result="$(node app/scripts/next-version.js \
            --current "$baseline" \
            --labels-json "$labels" \
            --title "$title" \
            --override "${MANUAL_BUMP:-}")"

          current="$(printf '%s' "$result" | jq -r .current)"
          next="$(printf '%s' "$result" | jq -r .version)"
          bump="$(printf '%s' "$result" | jq -r .bump)"
          reason="$(printf '%s' "$result" | jq -r .reason)"

          {
            echo "current=$current"
            echo "version=$next"
            echo "bump=$bump"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release version"
            echo
            echo "\`${current}\` → \`${next}\` (${bump}: ${reason})"
            if [ -n "$pull_number" ]; then
              echo
              echo "Source: #${pull_number} — ${title}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    # The Developer ID certificate and the notarization key live in this
    # environment, which only main may use. Only the macOS leg asks for it: an
    # empty name means no environment, so Windows and Linux never see them.
    environment: ${{ matrix.os == 'macos-latest' && 'apple-signing' || '' }}
    env:
      # The official repository never ships a macOS build that macOS would
      # refuse to open. A fork has no certificate, and builds ad-hoc instead.
      REQUIRE_MAC_NOTARIZATION: ${{ matrix.os == 'macos-latest' && github.repository == 'magnuslandahl/FeedbackRecorder' }}
    # One platform failing must not withhold the installers that did build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: --win --x64
          - os: macos-latest
            label: macOS
            args: --mac --arm64 --x64
          - os: ubuntu-latest
            label: Linux
            args: --linux --x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Apply the release version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: app

      # Stamps the build so the app can say which one it is. Without this it
      # reports itself as a development build, which is what running from source
      # is.
      - name: Stamp the build
        run: npm run build-info
        working-directory: app
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_BUILD: 'true'

      # The speech models are ~490 MB and identical on every platform, so all
      # three builds share one cache entry.
      - name: Restore the speech models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/vendor/models
          key: whisper-models-${{ hashFiles('app/scripts/fetch-vendor.js') }}

      # On macOS this compiles whisper.cpp as a universal binary, because the
      # project publishes no prebuilt macOS command-line build.
      - name: Fetch whisper.cpp and the models
        run: npm run vendor
        working-directory: app
        env:
          WHISPER_MAC_ARCHS: arm64;x86_64

      - name: Check the macOS binaries are self-contained
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          binary=app/vendor/whisper/whisper-cli
          file "$binary"
          otool -L "$binary"
          # A dependency on Homebrew or another local install would run here and
          # fail on the user's machine, which is the worst place to find out.
          if otool -L "$binary" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "::error::whisper-cli links against libraries that only exist on this build machine."
            exit 1
          fi
          for arch in arm64 x86_64; do
            lipo -info "$binary" | grep -q "$arch" \
              || { echo "::error::whisper-cli is missing the $arch slice."; exit 1; }
          done

          helper=app/vendor/input/input-tap
          file "$helper"
          otool -L "$helper"
          if otool -L "$helper" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "::error::input-tap links against libraries that only exist on this build machine."
            exit 1
          fi
          for arch in arm64 x86_64; do
            lipo -info "$helper" | grep -q "$arch" \
              || { echo "::error::input-tap is missing the $arch slice."; exit 1; }
          done

          # Ordinary typing must have been redacted before it left the helper:
          # a typing line with a key code could be reconstructed downstream.
          "$helper" --selftest > "$RUNNER_TEMP/input-tap-selftest.jsonl"
          node - "$RUNNER_TEMP/input-tap-selftest.jsonl" <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync(process.argv[2], 'utf8').trim().split('\n').map(JSON.parse);
          const typing = rows.filter((row) => row.typing);
          if (!typing.length || typing.some((row) => 'code' in row || 'character' in row)) {
            throw new Error(`ordinary typing was not redacted: ${JSON.stringify(typing)}`);
          }
          NODE

      - name: Check Windows input helper redaction
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = 'app\vendor\input\input-tap.exe'
          $rows = @(& $helper --selftest | ForEach-Object { $_ | ConvertFrom-Json })
          if ($LASTEXITCODE -ne 0) { throw 'Windows input helper self-test failed.' }
          $typing = @($rows | Where-Object { $_.typing -eq $true })
          if ($typing.Count -lt 1) { throw 'Windows input helper did not report redacted typing.' }
          foreach ($entry in $typing) {
            if ($entry.PSObject.Properties.Name -contains 'code' -or
                $entry.PSObject.Properties.Name -contains 'character') {
              throw 'Windows input helper exposed a typed key.'
            }
          }

      - name: Build the installer
        working-directory: app
        env:
          # Only the macOS leg is given the apple-signing environment, so these
          # are empty everywhere else, in forks, and anywhere but main: the
          # environment only admits main, and pull requests never run this
          # workflow.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Not a secret: it is printed in every signature it produces.
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          extra=""

          if [ "${REQUIRE_MAC_NOTARIZATION:-false}" = "true" ]; then
            # Fails here, before an hour of building, rather than publishing a
            # download that macOS blocks.
            missing=""
            [ -n "${MAC_CSC_LINK:-}" ] || missing="$missing MAC_CSC_LINK"
            [ -n "${MAC_CSC_KEY_PASSWORD:-}" ] || missing="$missing MAC_CSC_KEY_PASSWORD"
            [ -n "${APPLE_API_KEY_P8:-}" ] || missing="$missing APPLE_API_KEY_P8"
            [ -n "${APPLE_API_KEY_ID:-}" ] || missing="$missing APPLE_API_KEY_ID"
            [ -n "${APPLE_API_ISSUER:-}" ] || missing="$missing APPLE_API_ISSUER"
            [ -n "${APPLE_TEAM_ID:-}" ] || missing="$missing APPLE_TEAM_ID"
            if [ -n "$missing" ]; then
              echo "::error::Official macOS releases must be signed and notarized, but the apple-signing environment is missing:$missing. See docs/SIGNING.md."
              exit 1
            fi
          fi

          if [ -n "${APPLE_TEAM_ID:-}" ] && ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APPLE_TEAM_ID is not a ten-character Apple Team ID."
            exit 1
          fi

          if [ "${{ runner.os }}" = "macOS" ] && [ -n "${MAC_CSC_LINK:-}" ]; then
            echo "macOS signing certificate configured: signing the app."
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"

            if [ -n "${APPLE_API_KEY_P8:-}" ]; then
              # notarytool wants a path to the key file, not the key itself.
              # RUNNER_TEMP is discarded when the job ends.
              key_file="$RUNNER_TEMP/apple-api-key.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$key_file"
              chmod 600 "$key_file"
              export APPLE_API_KEY="$key_file"
              extra="-c.mac.notarize=true"
              echo "App Store Connect key configured: the app will be notarized."
            else
              echo "::warning::Signing without notarizing — no App Store Connect key is set, so Gatekeeper will still block the app."
            fi
          else
            echo "No signing certificate configured: building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          npm run dist -- ${{ matrix.args }} $extra

          if [ "${{ runner.os }}" = "macOS" ] && [ -n "${MAC_CSC_LINK:-}" ]; then
            expected_requirement=""
            for bundle in dist/mac*/*.app; do
              [ -e "$bundle" ] || continue
              requirement="$(codesign --display -r - "$bundle" 2>&1 | sed -nE 's/^#?[[:space:]]*(designated =>.*)$/\1/p' | head -1)"
              echo "$bundle: $requirement"
              if [ -z "$requirement" ] || printf '%s' "$requirement" | grep -q 'cdhash'; then
                echo "::error::The configured certificate did not produce a stable designated requirement."
                exit 1
              fi
              if [ -n "$expected_requirement" ] && [ "$requirement" != "$expected_requirement" ]; then
                echo "::error::The macOS architectures were not signed with the same designated requirement."
                exit 1
              fi
              expected_requirement="$requirement"

              # The certificate in the secret is the one that was meant: a
              # Developer ID from this team, chaining to Apple. The installed
              # app's updater refuses anything else, so a wrong certificate here
              # would strand every existing user on this version.
              if [ -n "${APPLE_TEAM_ID:-}" ]; then
                details="$(codesign --display --verbose=2 "$bundle" 2>&1)"
                if ! printf '%s\n' "$details" | grep -q '^Authority=Developer ID Application: '; then
                  echo "::error::$bundle is not signed with a Developer ID Application certificate."
                  exit 1
                fi
                team="$(printf '%s\n' "$details" | sed -n 's/^TeamIdentifier=//p' | head -1)"
                if [ "$team" != "$APPLE_TEAM_ID" ]; then
                  echo "::error::$bundle is signed by team '${team}', not ${APPLE_TEAM_ID}."
                  exit 1
                fi
                codesign --verify --deep --strict \
                  -R "=anchor apple generic and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\"" \
                  "$bundle"
              fi

              if [ -n "$extra" ]; then
                # Stapled, so the first launch does not depend on reaching Apple.
                xcrun stapler validate "$bundle"
                if spctl --status 2>&1 | grep -q 'assessments enabled'; then
                  assessment="$(spctl --assess --type execute --verbose=2 "$bundle" 2>&1 || true)"
                  echo "$assessment"
                  if ! printf '%s\n' "$assessment" | grep -q 'source=Notarized Developer ID'; then
                    echo "::error::Gatekeeper does not accept $bundle as notarized."
                    exit 1
                  fi
                else
                  echo "::warning::Gatekeeper is disabled on this runner, so its verdict could not be checked; the stapled ticket was."
                fi
              fi
            done
            [ -n "$expected_requirement" ] || {
              echo "::error::No signed macOS application was produced."
              exit 1
            }
          fi

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/apple-api-key.p8"

      - name: Report what the macOS build is signed with
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          set -euo pipefail
          # Says plainly whether this build is notarized, so a silently unsigned
          # release cannot masquerade as a signed one.
          for app in dist/mac*/*.app; do
            [ -e "$app" ] || continue
            echo "== $app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Authority|Signature|TeamIdentifier' || true
            spctl --assess --verbose --type exec "$app" 2>&1 || true
            xcrun stapler validate "$app" 2>&1 || true
          done

      - name: Check the disk image contains what a new user needs
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          set -euo pipefail
          # The disk image is the only thing the person who downloaded it sees.
          # Official builds open normally, but a build from a fork or a local
          # checkout is ad-hoc signed and macOS refuses it on first run, so the
          # instructions for that stay in the image. If they silently stop
          # being included — a moved file, a path that resolves differently on
          # the runner than locally — the download still works and nobody finds
          # out until a confused user does.
          #
          # This is also the only check anywhere that the disk image layout
          # survived: it cannot be built or mounted off macOS.
          for dmg in dist/*.dmg; do
            [ -e "$dmg" ] || continue
            echo "== $dmg"
            mount_point="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
            ls -la "$mount_point"

            missing=""
            [ -d "$mount_point/FeedbackRecorder.app" ] || missing="$missing the app;"
            [ -e "$mount_point/Applications" ] || missing="$missing the Applications link;"

            # The copy people drag out is the one in the image, not the one in
            # dist/, so its ticket is checked where it will actually be used.
            if [ "${REQUIRE_MAC_NOTARIZATION:-false}" = "true" ] && [ -d "$mount_point/FeedbackRecorder.app" ]; then
              xcrun stapler validate "$mount_point/FeedbackRecorder.app" \
                || missing="$missing a notarized, stapled app;"
            fi

            # Found by extension rather than by name, so renaming the file in
            # electron-builder.yml does not fail a build that is actually fine.
            # What it is called is the unit test's business; that it is there
            # and says the right things is this one's.
            readme="$(find "$mount_point" -maxdepth 1 -name '*.txt' | head -n 1)"
            if [ -n "$readme" ]; then
              # Present is not the same as useful. These two are the ones a
              # stuck user actually needs: the button to press, and the reason
              # not to obey macOS and throw the app away.
              grep -q 'Open Anyway' "$readme" || missing="$missing the Open Anyway step;"
              grep -q 'damaged' "$readme" || missing="$missing the damaged-app warning;"
            else
              missing="$missing the opening instructions;"
            fi

            hdiutil detach "$mount_point" >/dev/null
            rmdir "$mount_point" || true

            if [ -n "$missing" ]; then
              echo "::error::$(basename "$dmg") is missing:$missing"
              exit 1
            fi
            echo "   contains the app, the Applications link and the instructions"
          done

      - name: List what was built
        run: ls -lh app/dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.label }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed; zipping them again only costs time.
          compression-level: 0

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [version, build]
    # Publishes whatever built, so a broken platform does not block the others.
    if: always() && needs.version.result == 'success' && needs.build.result != 'cancelled'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Check something was built
        run: |
          set -euo pipefail
          ls -lh installers
          if [ -z "$(ls -A installers 2>/dev/null)" ]; then
            echo "::error::No installers were produced, so there is nothing to publish."
            exit 1
          fi

      - name: Add checksums
        working-directory: installers
        run: sha256sum -- ./* > SHA256SUMS.txt

      - name: Verify release subjects
        working-directory: installers
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=( *.exe *.dmg *.AppImage )
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No supported installer files were produced."
            exit 1
          fi
          if [ "$(find . -maxdepth 1 -type f ! -name '*.exe' ! -name '*.dmg' ! -name '*.AppImage' ! -name 'SHA256SUMS.txt' | wc -l)" -ne 0 ]; then
            echo "::error::The release directory contains an unexpected file."
            find . -maxdepth 1 -type f -print
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS.txt

      - name: Attest installers and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: installers/*

      - name: Work out which release this is
        id: target
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "tag=latest"
            echo "title=FeedbackRecorder ${VERSION}"
            echo "display=${VERSION}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.target.outputs.version }}
          DISPLAY: ${{ steps.target.outputs.display }}
          CURRENT: ${{ needs.version.outputs.current }}
          TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Each row names the file that was actually built.
          row() {
            local label="$1" pattern="$2"
            local file
            file="$(find installers -maxdepth 1 -type f -name "$pattern" -print \
              | sort | head -1 | sed 's#^installers/##')"
            if [ -n "$file" ]; then
              echo "| **${label}** | [\`${file}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}) |"
            fi
          }

          {
            echo "## Download FeedbackRecorder ${DISPLAY}"
            echo
            echo "Pick the one file that matches your computer. Each link downloads the installer directly."
            echo
            echo "| Your computer | Download |"
            echo "| --- | --- |"
            row "Windows" "*Windows*.exe"
            row "Mac (2020 or newer, Apple M-series)" "*macOS-arm64*.dmg"
            row "Mac (older, Intel)" "*macOS-x64*.dmg"
            row "Linux" "*Linux*.AppImage"
            echo
            echo "Everything is included. There is nothing else to install, and no account to create."
            echo "The download is large (around 1 GB) because the speech-recognition model is inside it,"
            echo "which is what lets the app transcribe your voice on your own machine."
            echo
            if [ "${GITHUB_REPOSITORY}" = "magnuslandahl/FeedbackRecorder" ] \
              && [ -n "$(find installers -maxdepth 1 -type f -name '*.dmg' -print -quit)" ]; then
              # The macOS build fails rather than publish without notarization
              # here, so a disk image in this release is a notarized one.
              echo "**macOS builds are signed by Rabamba AB and notarized by Apple, so they open normally.**"
              echo "**Windows installers are unsigned**, so Windows shows a SmartScreen warning the first time. Follow"
            else
              echo "**Current Windows installers are unsigned; macOS builds are not Developer ID signed or notarized.**"
              echo "First launch therefore shows an operating-system warning. Follow"
            fi
            echo "[Getting started](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/GETTING_STARTED.md)"
            echo "for the exact install and permission steps."
            echo
            echo "---"
            echo
            echo "**Version ${DISPLAY}**, built from [commit \`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo "The app shows this same version next to its name, and writes it into every"
            echo "package it makes, so a bug report can say which build produced it."
            echo
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${CURRENT#v}" >/dev/null 2>&1; then
              echo
              echo "[Changes since v${CURRENT#v}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/v${CURRENT#v}...${GITHUB_SHA})"
            fi
            echo
            echo "### Verification details"
            echo
            echo "Download [\`SHA256SUMS.txt\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS.txt)"
            echo "and compare the SHA-256 shown for your installer. On macOS or Linux:"
            echo
            echo "\`\`\`bash"
            echo "shasum -a 256 <downloaded-file>  # macOS"
            echo "sha256sum <downloaded-file>      # Linux"
            echo "\`\`\`"
            echo
            echo "GitHub also records an artifact attestation for every installer and the checksum file."
            echo "Verify that the downloaded file came from this repository's workflow:"
            echo
            echo "\`\`\`bash"
            echo "gh attestation verify <file> -R magnuslandahl/FeedbackRecorder"
            echo "\`\`\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          TITLE: ${{ steps.target.outputs.title }}
        run: |
          set -euo pipefail
          # The rolling release always points at the newest main build, so it is
          # replaced rather than appended to; stale installers next to fresh ones
          # would be worse than none.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag
          fi

          gh release create "${TAG}" \
            --title "${TITLE}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            --latest \
            installers/*

          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          remote_assets="$RUNNER_TEMP/remote-release-assets.txt"
          for file in installers/*; do
            printf '%s\tsha256:%s\n' \
              "$(basename "$file")" \
              "$(sha256sum "$file" | cut -d ' ' -f 1)"
          done | sort > "$expected_assets"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | [.name, .digest] | @tsv' \
            | sort > "$remote_assets"
          diff -u "$expected_assets" "$remote_assets"

          # Keep the semantic history in git even though the downloadable
          # release deliberately retains the stable `latest` URL.
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${{ needs.version.outputs.version }}" \
            -f "sha=${GITHUB_SHA}"

          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
