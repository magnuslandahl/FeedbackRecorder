appId: com.feedbackrecorder.app
productName: FeedbackRecorder
copyright: FeedbackRecorder

# There is no update server and nothing is published to a release feed. Without
# this, electron-builder tries to write update metadata after the installer is
# already built and fails on a repository it cannot find.
publish: null

directories:
  output: dist
  buildResources: build

# No production dependencies: Electron is the runtime and everything else is
# either source or a bundled binary under vendor/.
files:
  - src/**/*
  - package.json
  - '!**/*.map'

# vendor/ holds whisper.cpp and its models. It stays outside the asar archive so
# the binary can be executed and the models memory-mapped, and it is found at
# runtime through process.resourcesPath.
extraResources:
  - from: vendor
    to: vendor
    filter:
      - '**/*'
      # The shipping model is small; base is only useful during development.
      - '!models/ggml-base.bin'
      # whisper.cpp ships a pile of demos and test binaries next to the CLI.
      - '!whisper/**/test-*'
      - '!whisper/**/parakeet*'
      - '!whisper/**/wchess*'
      - '!whisper/**/SDL2.dll'
      - '!whisper/**/*stream*'
      - '!whisper/**/*command*'
      - '!whisper/**/*bench*'
      - '!whisper/**/*talk*'
      - '!whisper/**/*server*'
      - '!whisper/**/*lsp*'
      - '!whisper/**/*quantize*'

asar: true
compression: normal

# Ad-hoc signs the macOS bundle once its contents are final. Without it the app
# will not launch on Apple Silicon at all.
afterPack: build/after-pack.js

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Unsigned for now. A colleague's machine will warn on first run until this
  # gets a certificate.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FeedbackRecorder
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # No version in the name, so the download link published in the README keeps
  # working after a release.
  artifactName: FeedbackRecorder-Windows-${arch}-Setup.${ext}

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Screen Recording and Microphone are TCC-gated and must be declared, or macOS
  # denies them without ever prompting.
  extendInfo:
    NSMicrophoneUsageDescription: FeedbackRecorder records your narration while you talk through your screen.
    NSCameraUsageDescription: Not used.
  # Signing is decided by the release workflow, not here. With an Apple
  # certificate in the environment the app is signed and notarized; with none it
  # falls back to the ad-hoc signature in build/after-pack.js. No identity is
  # named, because naming one would pin the build to a certificate that most
  # people cloning this repository do not have.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # whisper-cli is copied in as an extra resource, so it is not part of the app's
  # own code and is not signed along with it. Notarization rejects any unsigned
  # binary inside the bundle, so it is named here. Relative paths resolve from
  # the .app root. Ignored entirely when the build is unsigned.
  binaries:
    - Contents/Resources/vendor/whisper/whisper-cli

dmg:
  artifactName: FeedbackRecorder-macOS-${arch}.${ext}
  # The instructions travel with the download.
  #
  # Whoever double-clicks the .dmg is not looking at the repository, and the
  # first thing macOS tells them is that the app cannot be opened. Without
  # something in this window saying that is expected and what to do about it,
  # the honest reading is that the download is broken.
  #
  # A text file rather than a helper script, and that is not laziness: a script
  # in a downloaded disk image is quarantined like everything else in it, so
  # macOS blocks the very script whose job was to clear the quarantine. It would
  # fail for exactly the people who need it.
  #
  # Listing contents replaces the default layout, so the app and the
  # /Applications link have to be named here too. Their coordinates are
  # electron-builder's own defaults; the window is taller to make room.
  window:
    width: 540
    height: 420
  contents:
    - x: 130
      y: 200
      type: file
      name: FeedbackRecorder.app
    - x: 410
      y: 200
      type: link
      path: /Applications
    - x: 270
      y: 330
      type: file
      path: build/dmg-readme.txt
      name: How to open this app.txt

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development

appImage:
  artifactName: FeedbackRecorder-Linux-${arch}.${ext}
