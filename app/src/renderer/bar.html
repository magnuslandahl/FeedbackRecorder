<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Recording</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bar">
    <div class="bar-inner">
      <span class="dot"></span>
      <span class="bar-label">Recording</span>
      <span class="bar-time" id="time">00:00</span>
      <div class="meter bar-meter" role="meter" aria-label="Microphone level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="mic-level">
        <div class="meter-target"></div>
        <div class="meter-fill" id="level"></div>
      </div>
      <div class="bar-actions">
        <button id="stop" class="primary" type="button">Stop</button>
        <button id="actions-toggle" type="button" aria-label="More recording actions" aria-haspopup="menu" aria-expanded="false" title="More recording actions">&#9662;</button>
      </div>
    </div>
    <script src="bar.js"></script>
  </body>
</html>
