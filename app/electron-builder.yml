appId: com.feedbackrecorder.app
productName: FeedbackRecorder
copyright: Copyright © 2026 Rabamba AB

# There is no update server and nothing is published to a release feed. Without
# this, electron-builder tries to write update metadata after the installer is
# already built and fails on a repository it cannot find.
publish: null

directories:
  output: dist
  buildResources: build

# No production dependencies: Electron is the runtime and everything else is
# either source or a bundled binary under vendor/.
files:
  - src/**/*
  - package.json
  - '!**/*.map'

# vendor/ holds whisper.cpp, its models, and the platform input helper. It stays
# outside the asar archive so the binaries can be executed and the models
# memory-mapped; runtime locates them through process.resourcesPath.
extraResources:
  - from: vendor
    to: vendor
    filter:
      - '**/*'
      # Both small models ship; multilingual base is only for development.
      - '!models/ggml-base.bin'
      # whisper.cpp ships a pile of demos and test binaries next to the CLI.
      - '!whisper/**/test-*'
      - '!whisper/**/parakeet*'
      - '!whisper/**/wchess*'
      - '!whisper/**/SDL2.dll'
      - '!whisper/**/*stream*'
      - '!whisper/**/*command*'
      - '!whisper/**/*bench*'
      - '!whisper/**/*talk*'
      - '!whisper/**/*server*'
      - '!whisper/**/*lsp*'
      - '!whisper/**/*quantize*'
  - from: build/kb-whisper-LICENSE.txt
    to: vendor/models/KB-WHISPER-LICENSE.txt

asar: true
compression: normal

# Ad-hoc signs the macOS bundle once its contents are final when no certificate
# is configured. Without it such a build will not launch on Apple Silicon at all.
afterPack: build/after-pack.js

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Unsigned for now. A colleague's machine will warn on first run until this
  # gets a certificate.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FeedbackRecorder
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # No version in the name, so the download link published in the README keeps
  # working after a release.
  artifactName: FeedbackRecorder-Windows-${arch}-Setup.${ext}

mac:
  # The macOS variant has the transparent margin and shadow the Dock expects;
  # the full-bleed icon.png looked oversized next to every other app.
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Screen Recording and Microphone are TCC-gated and must be declared, or macOS
  # denies them without ever prompting.
  extendInfo:
    NSMicrophoneUsageDescription: FeedbackRecorder records your narration while you talk through your screen.
    NSInputMonitoringUsageDescription: FeedbackRecorder records click types, shortcuts and navigation keys while a walkthrough is recorded. Ordinary typed text is never stored.
    NSCameraUsageDescription: Not used.
  # Signing is decided by the release workflow, not here. Official releases are
  # signed with the Rabamba AB Developer ID certificate and notarized; with no
  # certificate in the environment the build falls back to the ad-hoc signature
  # in build/after-pack.js. No identity is named, because naming one would pin
  # the build to a certificate that most people cloning this repository do not
  # have. docs/SIGNING.md describes both, and how to sign locally.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # whisper-cli is copied in as an extra resource, so it is not part of the app's
  # own code and is not signed along with it. Notarization rejects any unsigned
  # binary inside the bundle, so it is named here. Relative paths resolve from
  # the .app root. Ignored entirely when the build is unsigned.
  binaries:
    - Contents/Resources/vendor/whisper/whisper-cli
    - Contents/Resources/vendor/input/input-tap

dmg:
  artifactName: FeedbackRecorder-macOS-${arch}.${ext}
  # The instructions travel with the download.
  #
  # Whoever double-clicks the .dmg is not looking at the repository. Official
  # releases open normally, but a build without the certificate — a fork, a
  # local checkout — is met with macOS saying the app cannot be opened. Without
  # something in this window saying what to do about it, the honest reading is
  # that the download is broken.
  #
  # A text file rather than a helper script, and that is not laziness: a script
  # in a downloaded disk image is quarantined like everything else in it, so
  # macOS blocks the very script whose job was to clear the quarantine. It would
  # fail for exactly the people who need it.
  #
  # Listing contents replaces the default layout, so the app and the
  # /Applications link have to be named here too.
  #
  # backgroundColor rather than a background image, and that is what makes the
  # window size below mean anything. electron-builder falls back to its own
  # 540x380 background template when neither is given, and then takes the window
  # size *from that image* — so the window here was silently 540x380 whatever it
  # said, and the instructions at y=330 had their label running off the bottom.
  # Measured from the .DS_Store of a real build. The two settings are mutually
  # exclusive, so naming a colour is also how the image is declined.
  #
  # The colour is the template's own flat grey, sampled from it, so nothing about
  # how the window looks changes — only that its size is now what this file says.
  backgroundColor: '#edecec'
  window:
    width: 540
    height: 440
  contents:
    - x: 130
      y: 200
      type: file
      name: FeedbackRecorder.app
    - x: 410
      y: 200
      type: link
      path: /Applications
    # Coordinates are the centre of an 80 px icon, and the label hangs below it
    # and wraps — "How to open this app.txt" is long enough to take three lines —
    # so this sits well clear of the bottom rather than measured to the pixel.
    - x: 270
      y: 310
      type: file
      path: build/dmg-readme.txt
      name: How to open this app.txt

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development

appImage:
  artifactName: FeedbackRecorder-Linux-${arch}.${ext}
