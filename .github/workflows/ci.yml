name: CI

# Every pull request has to pass this before it can be merged, and main is
# re-checked after each merge. The jobs are split so a red run says which part
# broke: the pure logic, the media pipeline, packaging, or the legacy CLI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Pure logic tests
        run: npm test
        working-directory: app

  electron:
    name: Electron tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # The Electron harnesses open real windows. Linux runners have no display,
      # so they run under Xvfb; on Windows this expands to nothing.
      XVFB: ${{ matrix.os == 'ubuntu-latest' && 'xvfb-run -a' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # Chromium refuses to start when its SUID sandbox helper is not owned by
      # root, and npm cannot set that. Electron fetches that helper on first use
      # rather than during npm ci, so it is downloaded here first. Fixing the
      # ownership keeps the sandbox on, which --no-sandbox would have quietly
      # turned off for every test.
      - name: Let Electron's sandbox start
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
        working-directory: app

      - name: Media pipeline
        run: $XVFB npm run test:pipeline
        working-directory: app

      - name: UI smoke test
        run: $XVFB npm run test:ui
        working-directory: app

  package:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # Proves electron-builder.yml still describes a buildable app without
      # downloading the ~500 MB of models a real release needs. vendor/ is an
      # extraResources root, so it has to exist even when it is empty.
      - name: Build the unpacked app
        run: |
          mkdir -p vendor
          npm run dist:dir -- --linux
        working-directory: app

      - name: Check the build produced an app
        run: test -f app/dist/linux-unpacked/resources/app.asar

  legacy-cli:
    name: Legacy CLI tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Helper tests on Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\run-tests.ps1

      - name: Helper tests on PowerShell 7
        shell: pwsh
        run: .\scripts\run-tests.ps1

      - name: Skill installer dry run
        shell: pwsh
        run: .\scripts\install-skill.ps1 -WhatIf -SkillsRoot "$env:RUNNER_TEMP\skills"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repository is public, so AGENTS.md requires a secret scan before
      # anything is committed. Running it here makes the rule enforced rather
      # than merely written down. The release is pinned and checksummed, so a
      # replaced upstream asset cannot silently run something else.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact=100 --verbose

      - name: Scan the commit history
        run: gitleaks git . --no-banner --redact=100 --verbose

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [unit, electron, package, legacy-cli, secrets]
    if: always()
    steps:
      # One required check for branch protection, so adding a job above does not
      # also mean editing the protection rules.
      - name: Report the overall result
        run: |
          echo "unit:       ${{ needs.unit.result }}"
          echo "electron:   ${{ needs.electron.result }}"
          echo "package:    ${{ needs.package.result }}"
          echo "legacy-cli: ${{ needs.legacy-cli.result }}"
          echo "secrets:    ${{ needs.secrets.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::At least one CI job did not succeed."
            exit 1
          fi
